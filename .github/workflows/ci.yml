name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: parse
        env:
          CC: clang
        run: |
          tree-sitter generate --js-runtime native --abi 15
          tree-sitter test
          nu scripts/test-upstream.nu
          nu scripts/queries.nu check
          git diff --exit-code -- src/grammar.json src/node-types.json src/parser.c src/tree_sitter

      - name: check source
        run: |
          oxlint -D correctness -D suspicious -D perf -A no-underscore-dangle --deny-warnings grammar.js
          oxfmt --check grammar.js tree-sitter.json test/config.json mise.toml README.md
          clang-format --dry-run --Werror src/scanner.c bindings/c/tree_sitter/tree-sitter-luau.h
          clang-tidy src/scanner.c bindings/c/tree_sitter/tree-sitter-luau.h -- -xc -std=c11

      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
          cmake --build build --config Release
