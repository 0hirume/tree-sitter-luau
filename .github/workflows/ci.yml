name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3.28

      - name: check
        env:
          CC: clang
        run: |
          tree-sitter generate --js-runtime native --abi 15
          tree-sitter test
          nu scripts/upstream.nu
          nu scripts/queries.nu check
          oxlint -D correctness -D suspicious -D perf -A no-underscore-dangle --deny-warnings grammar.js
          oxfmt --check grammar.js tree-sitter.json test/config.json mise.toml README.md
          clang-format --dry-run --Werror src/scanner.c bindings/c/tree_sitter/tree-sitter-luau.h
          clang-tidy src/scanner.c bindings/c/tree_sitter/tree-sitter-luau.h -- -xc -std=c11
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
          cmake --build build
