name: types

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}

env:
  DOCS_REPOSITORY: Roblox/creator-docs

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write # push the generated update branch.
      pull-requests: write # create the review pull request.
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install nushell
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: aqua:nushell/nushell

      - name: update types
        run: nu .github/types.nu
